<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Game Collections</title>

    <!-- Vega libraries: same versions as the lab -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>

    <!-- CSS file -->
    <link rel="stylesheet" type="text/css" href="css/styles.css" media="all">
</head>

<body>
    <h1>Video Game Collections</h1>

    <!-- Container for the release trend line chart -->
    <div id="release_trend"></div>

    <!-- Load the Vega-Lite chart -->
    <script type="text/javascript">
        var vg_1 = "js/release_trend.vg.json";

        vegaEmbed("#release_trend", vg_1).then(function(result) {
            // Access the Vega view through result.view.
        }).catch(console.error);
    </script>
</body>

</html>
